name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Zfinix/gpuix
          ref: eleven
          path: gpuix
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Use the GPUIX types from the Eleven branch
        run: ELEVEN_GPUIX_SOURCE="$GITHUB_WORKSPACE/gpuix" bash script/build-gpuix --js-only
      - run: bunx tsc --noEmit --noUnusedLocals
